# Integración continua de zcorp-stack: en cada push y pull request
#   1. pruebas del backend contra PostgreSQL y Redis reales
#   2. lint, pruebas y compilación de la web
#   3. construcción de las imágenes Docker; en main además se suben a GHCR para el servidor
#      (ghcr.io/lewys19/blog-administrado-api y -web, con etiqueta latest y el hash del commit).
# La dirección pública, redes y correo de contacto de la web salen de las variables del repositorio
# (GitHub → Settings → Secrets and variables → Actions → Variables): SITIO_URL, CORREO_CONTACTO, RED_*.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Si llega otro push a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zcorp
          POSTGRES_USER: zcorp
          POSTGRES_PASSWORD: zcorp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zcorp" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://zcorp:zcorp@localhost:5432/zcorp
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Las migraciones coinciden con los modelos
        run: alembic upgrade head && alembic check
        env:
          SECRET_KEY: clave-de-ci-de-al-menos-32-caracteres-xx
      - run: pytest -q

  web:
    name: Web (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tipos que Next genera (LayoutProps, PageProps): no están en git (.next/ y next-env.d.ts se ignoran).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  imagenes:
    # Construye las imágenes en cada push (un Dockerfile roto se detecta en la rama),
    # pero solo las sube a GHCR cuando el push es a main (producción).
    name: Imagen Docker (${{ matrix.servicio }})
    needs: [backend, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servicio: api
            carpeta: backend
          - servicio: web
            carpeta: web
    env:
      SUBIR: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.SUBIR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Etiquetas: "latest" (lo que descarga el VPS) y el hash del commit (para volver a una versión anterior).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blog-administrado-${{ matrix.servicio }}
          tags: |
            type=raw,value=latest,enable=${{ env.SUBIR }}
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.carpeta }}
          push: ${{ env.SUBIR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo la web los usa (la API los ignora).
          build-args: |
            SITIO_URL=${{ vars.SITIO_URL || 'https://blog.zcorp23.com' }}
            CORREO_CONTACTO=${{ vars.CORREO_CONTACTO }}
            RED_FACEBOOK=${{ vars.RED_FACEBOOK }}
            RED_X=${{ vars.RED_X }}
            RED_LINKEDIN=${{ vars.RED_LINKEDIN }}
            RED_YOUTUBE=${{ vars.RED_YOUTUBE }}
            RED_GITHUB=${{ vars.RED_GITHUB }}
          cache-from: type=gha,scope=${{ matrix.carpeta }}
          cache-to: type=gha,mode=max,scope=${{ matrix.carpeta }}
