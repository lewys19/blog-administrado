# Integración continua de zcorp-stack: en cada push y pull request
#   1. pruebas del backend contra PostgreSQL y Redis reales
#   2. lint, pruebas y compilación de la web
#   3. construcción de las imágenes Docker (detecta un Dockerfile roto antes de llegar a main)
# Publicar imágenes y desplegar se agrega cuando haya dominio (al final del Sprint 0).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Si llega otro push a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zcorp
          POSTGRES_USER: zcorp
          POSTGRES_PASSWORD: zcorp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zcorp" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://zcorp:zcorp@localhost:5432/zcorp
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Las migraciones coinciden con los modelos
        run: alembic upgrade head && alembic check
        env:
          SECRET_KEY: clave-de-ci-de-al-menos-32-caracteres-xx
      - run: pytest -q

  web:
    name: Web (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tipos que Next genera (LayoutProps, PageProps): no están en git (.next/ y next-env.d.ts se ignoran).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  imagenes:
    name: Imagen Docker (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t zcorp-${{ matrix.servicio }} ${{ matrix.servicio }}
